services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_certs:/etc/letsencrypt
    networks:
      - proxy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: minorfm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/minorfm?sslmode=disable
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
      - proxy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: https://api.minor.fm
        NEXT_PUBLIC_WS_URL: wss://api.minor.fm
    restart: unless-stopped
    networks:
      - proxy

  streamer:
    build: ./streamer
    restart: unless-stopped
    environment:
      STREAMER_USER: ${STREAMER_USER:-admin}
      STREAMER_PASS: ${STREAMER_PASS}
    volumes:
      - streamer_uploads:/app/uploads
    networks:
      - proxy

volumes:
  npm_data:
  npm_certs:
  pgdata:
  redisdata:
  streamer_uploads:

networks:
  backend:
    driver: bridge
  proxy:
    driver: bridge
