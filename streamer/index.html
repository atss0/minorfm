<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MINOR.fm Streamer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      background: #080808;
      color: #d0d0d0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      padding: 18px 28px;
      border-bottom: 1px solid #161616;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #fff;
    }
    .logo span { color: #888; font-weight: 400; }

    .badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .badge.live  { color: #ff3b3b; }
    .badge.live  .badge-dot { background: #ff3b3b; animation: blink 1.4s ease-in-out infinite; }
    .badge.idle  { color: #666; }
    .badge.idle  .badge-dot { background: #666; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    /* ── Layout ── */
    main {
      flex: 1;
      padding: 28px;
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Card ── */
    .card {
      background: #0f0f0f;
      border: 1px solid #1c1c1c;
      border-radius: 6px;
      padding: 18px 20px;
    }
    .card-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #777;
      margin-bottom: 14px;
    }

    /* ── Now Playing ── */
    .now-playing-title {
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
      min-height: 24px;
    }
    .stream-info {
      font-size: 11px;
      color: #666;
      margin-bottom: 16px;
    }
    .stream-info a { color: #999; text-decoration: none; }
    .stream-info a:hover { color: #ccc; }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .listener-count {
      margin-left: auto;
      font-size: 11px;
      color: #777;
    }

    /* ── Audio Player ── */
    .player-wrap {
      margin-top: 14px;
      display: none;
    }
    audio {
      width: 100%;
      height: 28px;
      accent-color: #fff;
    }

    /* ── Buttons ── */
    button {
      cursor: pointer;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      line-height: 1;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .btn {
      padding: 7px 13px;
      background: #181818;
      color: #bbb;
      border: 1px solid #2e2e2e;
    }
    .btn:hover { background: #222; color: #ddd; }
    .btn:disabled { opacity: .4; cursor: default; }

    .btn-white {
      padding: 7px 13px;
      background: #e8e8e8;
      color: #000;
      border: 1px solid transparent;
    }
    .btn-white:hover { background: #fff; }

    .btn-icon {
      padding: 5px 8px;
      background: transparent;
      color: #777;
      border: 1px solid transparent;
      font-size: 15px;
    }
    .btn-icon:hover { color: #ff4444; background: rgba(255,68,68,.07); }

    /* ── Add Form ── */
    .add-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: #0a0a0a;
      border: 1px solid #1e1e1e;
      border-radius: 4px;
      color: #d0d0d0;
      font-family: inherit;
      font-size: 12px;
      padding: 7px 11px;
      outline: none;
      transition: border-color .15s;
    }
    input[type="text"]::placeholder { color: #555; }
    input[type="text"]:focus { border-color: #555; }
    input[type="file"] { display: none; }

    /* ── Queue List ── */
    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-height: 44px;
    }

    .queue-empty {
      font-size: 12px;
      color: #666;
      padding: 14px 10px;
      text-align: center;
    }

    .queue-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      background: #0a0a0a;
      border: 1px solid #181818;
      border-radius: 4px;
      cursor: default;
      transition: background .1s, border-color .1s, opacity .15s;
      user-select: none;
    }
    .queue-item.dragging  { opacity: .3; }
    .queue-item.drag-over { border-color: #383838; background: #131313; }

    .drag-handle {
      color: #555;
      cursor: grab;
      font-size: 15px;
      flex-shrink: 0;
      line-height: 1;
      padding: 2px 3px;
    }
    .drag-handle:hover { color: #aaa; }
    .drag-handle:active { cursor: grabbing; }

    .track-num {
      font-size: 10px;
      color: #666;
      width: 16px;
      text-align: right;
      flex-shrink: 0;
    }

    .track-title {
      flex: 1;
      font-size: 12px;
      color: #d0d0d0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-tag {
      font-size: 9px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #666;
      flex-shrink: 0;
    }

    /* ── Loop button active state ── */
    .btn.active {
      background: #1e1e1e;
      color: #fff;
      border-color: #555;
    }

    /* ── TTS ── */
    .tts-settings {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .tts-settings input[type="password"] {
      flex: 1;
      min-width: 160px;
      background: #0a0a0a;
      border: 1px solid #1e1e1e;
      border-radius: 4px;
      color: #d0d0d0;
      font-family: inherit;
      font-size: 12px;
      padding: 7px 11px;
      outline: none;
      transition: border-color .15s;
    }
    .tts-settings input[type="password"]:focus { border-color: #555; }
    .tts-settings input[type="password"]::placeholder { color: #555; }

    select {
      background: #0a0a0a;
      border: 1px solid #1e1e1e;
      border-radius: 4px;
      color: #d0d0d0;
      font-family: inherit;
      font-size: 12px;
      padding: 7px 10px;
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: #555; }

    textarea {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #1e1e1e;
      border-radius: 4px;
      color: #d0d0d0;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.6;
      padding: 10px 11px;
      outline: none;
      resize: vertical;
      transition: border-color .15s;
    }
    textarea:focus { border-color: #555; }
    textarea::placeholder { color: #555; }

    .tts-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      gap: 8px;
    }
    .tts-hint {
      font-size: 11px;
      color: #666;
    }
    .tts-hint.error { color: #ff5555; }
    .tts-hint.ok    { color: #55cc77; }

    /* ── Status bar ── */
    footer {
      padding: 10px 28px;
      border-top: 1px solid #1a1a1a;
      font-size: 10px;
      color: #666;
      letter-spacing: .04em;
    }
  </style>
</head>

<script>
  const AUTH = '__AUTH_TOKEN__' ? 'Basic __AUTH_TOKEN__' : '';

  function apiFetch(url, opts = {}) {
    if (AUTH) opts.headers = { 'Authorization': AUTH, ...(opts.headers || {}) };
    return fetch(url, opts);
  }

  let queue = [];
  let dragSrcIdx = null;

  // ── SSE ───────────────────────────────────────────────────────────────────

  function connectSSE() {
    const es = new EventSource('/events');
    es.onmessage = () => { fetchStatus(); fetchQueue(); };
    es.onerror   = () => { setTimeout(connectSSE, 3000); es.close(); };
  }
  connectSSE();

  // ── Data ──────────────────────────────────────────────────────────────────

  async function fetchStatus() {
    try {
      const s = await apiFetch('/api/status').then(r => r.json());
      const badge  = document.getElementById('liveBadge');
      const label  = document.getElementById('liveLabel');
      const title  = document.getElementById('nowPlaying');
      const count  = document.getElementById('listenerCount');
      const status = document.getElementById('statusBar');

      if (s.playing && s.current) {
        badge.className = 'badge live';
        label.textContent = 'LIVE';
        title.textContent = s.current.title;
        status.textContent = `▶ ${s.current.title}`;
      } else {
        badge.className = 'badge idle';
        label.textContent = 'IDLE';
        title.textContent = '—';
        status.textContent = 'Idle — add tracks to start streaming';
      }
      const n = s.listeners || 0;
      count.textContent = n === 1 ? '1 listener' : `${n} listeners`;
      setLoopUI(!!s.loop);
    } catch (_) {}
  }

  async function fetchQueue() {
    try {
      queue = await apiFetch('/api/queue').then(r => r.json()) || [];
      renderQueue();
    } catch (_) {}
  }

  // ── Render ────────────────────────────────────────────────────────────────

  function renderQueue() {
    const list = document.getElementById('queueList');
    document.getElementById('queueCount').textContent = queue.length;

    if (!queue.length) {
      list.innerHTML = '<div class="queue-empty">Queue is empty — add a URL or upload a file</div>';
      return;
    }

    list.innerHTML = '';
    queue.forEach((track, i) => {
      const el = document.createElement('div');
      el.className = 'queue-item';
      el.draggable = true;
      el.dataset.index = i;
      el.innerHTML = `
        <span class="drag-handle" title="Drag to reorder">⠿</span>
        <span class="track-num">${i + 1}</span>
        <span class="track-title" title="${esc(track.title)}">${esc(track.title)}</span>
        <span class="track-tag">${track.is_file ? 'file' : 'url'}</span>
        <button class="btn-icon" title="Remove" onclick="removeTrack('${track.id}')">×</button>
      `;
      el.addEventListener('dragstart', onDragStart);
      el.addEventListener('dragend',   onDragEnd);
      el.addEventListener('dragover',  onDragOver);
      el.addEventListener('dragleave', onDragLeave);
      el.addEventListener('drop',      onDrop);
      list.appendChild(el);
    });
  }

  // ── Drag & Drop ───────────────────────────────────────────────────────────

  function onDragStart(e) {
    dragSrcIdx = +e.currentTarget.dataset.index;
    e.currentTarget.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  }
  function onDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    document.querySelectorAll('.queue-item').forEach(el => el.classList.remove('drag-over'));
  }
  function onDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.queue-item').forEach(el => el.classList.remove('drag-over'));
    e.currentTarget.classList.add('drag-over');
  }
  function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }

  async function onDrop(e) {
    e.preventDefault();
    const targetIdx = +e.currentTarget.dataset.index;
    if (dragSrcIdx === null || dragSrcIdx === targetIdx) return;

    const moved = queue.splice(dragSrcIdx, 1)[0];
    queue.splice(targetIdx, 0, moved);
    dragSrcIdx = null;
    renderQueue(); // optimistic

    await apiFetch('/api/queue/reorder', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(queue.map(t => t.id)),
    });
  }

  // ── Actions ───────────────────────────────────────────────────────────────

  async function addURL() {
    const inp = document.getElementById('urlInput');
    const src = inp.value.trim();
    if (!src) return;

    const title = (() => {
      try { return decodeURIComponent(new URL(src).pathname.split('/').pop() || src); }
      catch { return src; }
    })();

    const r = await apiFetch('/api/queue', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source: src, title }),
    });
    if (r.ok) { inp.value = ''; }
    else { alert('Failed to add URL — check the server logs'); }
  }

  async function uploadFile(input) {
    const file = input.files[0];
    if (!file) return;

    const btn = document.getElementById('uploadBtn');
    btn.textContent = 'Uploading…';
    btn.disabled = true;

    const fd = new FormData();
    fd.append('file', file);

    try {
      const r = await apiFetch('/api/upload', { method: 'POST', body: fd });
      if (!r.ok) { alert('Upload failed: ' + await r.text()); }
    } finally {
      btn.textContent = 'Upload';
      btn.disabled = false;
      input.value = '';
    }
  }

  async function removeTrack(id) {
    queue = queue.filter(t => t.id !== id);
    renderQueue(); // optimistic
    await apiFetch(`/api/queue/${id}`, { method: 'DELETE' });
  }

  async function skip() {
    await apiFetch('/api/skip', { method: 'POST' });
  }

  function togglePlayer() {
    const wrap = document.getElementById('playerWrap');
    const player = document.getElementById('player');
    const btn = document.getElementById('playerBtn');
    if (wrap.style.display === 'block') {
      wrap.style.display = 'none';
      player.pause();
      btn.textContent = '▶ Play in browser';
    } else {
      wrap.style.display = 'block';
      player.load();
      player.play().catch(() => {});
      btn.textContent = '■ Stop player';
    }
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Loop ──────────────────────────────────────────────────────────────────

  let loopOn = false;

  function setLoopUI(on) {
    loopOn = on;
    const btn = document.getElementById('loopBtn');
    btn.textContent = `↻ Loop: ${on ? 'ON' : 'OFF'}`;
    btn.classList.toggle('active', on);
  }

  async function toggleLoop() {
    const next = !loopOn;
    setLoopUI(next);
    await apiFetch('/api/loop', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ loop: next }),
    });
  }

  // ── Live Mic ──────────────────────────────────────────────────────────────

  let micStream = null, micRecorder = null, micWS = null;

  async function toggleMic() {
    micWS ? stopMic() : startMic();
  }

  async function startMic() {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch (_) {
      setMicStatus('Mikrofon izni gerekli', true); return;
    }

    const token = AUTH ? AUTH.slice(6) : '';
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    micWS = new WebSocket(`${proto}://${location.host}/api/mic?token=${encodeURIComponent(token)}`);
    micWS.binaryType = 'arraybuffer';

    micWS.onopen = () => {
      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus' : 'audio/webm';
      micRecorder = new MediaRecorder(micStream, { mimeType: mime });
      micRecorder.ondataavailable = e => {
        if (e.data.size > 0 && micWS && micWS.readyState === WebSocket.OPEN)
          e.data.arrayBuffer().then(buf => micWS.send(buf));
      };
      micRecorder.start(100);
      const btn = document.getElementById('micBtn');
      btn.textContent = '⏹ Durdur';
      btn.classList.add('active');
      setMicStatus('🔴 Canlı yayın aktif', false);
    };

    micWS.onclose = e => {
      if (e.code === 1006 && !micRecorder) {
        setMicStatus('Başka bir yayın aktif', true);
        if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
        micWS = null;
      } else {
        stopMic();
      }
    };
    micWS.onerror = () => {};
  }

  function stopMic() {
    if (micRecorder) { micRecorder.stop(); micRecorder = null; }
    if (micStream)   { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (micWS)       { micWS.close(); micWS = null; }
    const btn = document.getElementById('micBtn');
    btn.textContent = '🎙 Başlat';
    btn.classList.remove('active');
    setMicStatus('Mikrofon kapalı', false);
  }

  function setMicStatus(msg, err) {
    const el = document.getElementById('micStatus');
    el.textContent = msg;
    el.style.color = err ? '#ff5555' : '#666';
  }

  // ── TTS ───────────────────────────────────────────────────────────────────

  async function generateTTS() {
    const text   = document.getElementById('ttsText').value.trim();
    const apiKey = document.getElementById('elApiKey').value.trim();
    const voice  = document.getElementById('elVoice').value;
    const model  = document.getElementById('elModel').value;
    const status = document.getElementById('ttsStatus');
    const btn    = document.getElementById('ttsBtn');

    if (!apiKey) { setTTSStatus('API key gerekli', 'error'); return; }
    if (!text)   { setTTSStatus('Metin gerekli', 'error'); return; }

    btn.disabled = true;
    btn.textContent = 'Oluşturuluyor…';
    setTTSStatus('ElevenLabs\'a gönderiliyor…', '');

    try {
      const r = await apiFetch('/api/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, api_key: apiKey, voice_id: voice, model_id: model }),
      });

      if (r.ok) {
        document.getElementById('ttsText').value = '';
        setTTSStatus('Sıraya eklendi ✓', 'ok');
        setTimeout(() => setTTSStatus('API key\'ini gir ve metni yaz', ''), 3000);
      } else {
        const msg = await r.text();
        setTTSStatus(msg || 'Hata oluştu', 'error');
      }
    } catch (e) {
      setTTSStatus('Sunucuya ulaşılamadı', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Oluştur & Sıraya Ekle';
    }
  }

  function setTTSStatus(msg, cls) {
    const el = document.getElementById('ttsStatus');
    el.textContent = msg;
    el.className = 'tts-hint' + (cls ? ' ' + cls : '');
  }

  // Ctrl+Enter in textarea → generate
  document.getElementById('ttsText').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) generateTTS();
  });

  // ── Init ──────────────────────────────────────────────────────────────────

  // Restore localStorage settings
  const savedKey   = localStorage.getItem('el_api_key');
  const savedVoice = localStorage.getItem('el_voice');
  const savedModel = localStorage.getItem('el_model');
  if (savedKey)   document.getElementById('elApiKey').value = savedKey;
  if (savedVoice) document.getElementById('elVoice').value  = savedVoice;
  if (savedModel) document.getElementById('elModel').value  = savedModel;

  // Initial load
  fetchStatus();
  fetchQueue();
</script>
</body>
</html>
