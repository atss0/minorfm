version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - bodyclose
    - noctx

linters-settings:
  goimports:
    local-prefixes: github.com/atss0/minorfm

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - text: "SA1019"
      linters:
        - staticcheck
